[workspace]
resolver = "2"
members = [
    "shared",
    "shells/leptos",
]

# Central version pinning. All crates reference these so versions never drift
# across the multiple Rust crates in the repo.
[workspace.dependencies]
crux_core = { version = "0.20", features = ["crux_macros", "facet_typegen"] }
crux_macros = "0.10"
facet = "0.46"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
boltffi = "=0.30.1"

# Optional deps for the `codegen` binary in `shared`.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
pretty_env_logger = "0.5"

# The shared Crux core.
shared = { path = "shared" }

# --- Web (Leptos) shell ---
leptos = "0.8"
console_error_panic_hook = "0.1"
thaw = "0.5.0-beta"

[profile.release]
opt-level = "s"
lto = true

[profile.release.package."*"]
codegen-units = 1
