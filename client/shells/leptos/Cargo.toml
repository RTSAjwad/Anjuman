[package]
name = "leptos_shell"
version = "0.1.0"
edition = "2021"
publish = false

# CSR-only: a single binary target (no separate `lib`), so there is no Cargo
# artifact name collision for trunk to trip over.
[[bin]]
name = "leptos_shell"
path = "src/main.rs"

[dependencies]
leptos = { workspace = true, features = ["csr"] }
thaw = { workspace = true }
icondata_core = "0.1"

shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
console_error_panic_hook = { workspace = true }
gloo-net = "0.7"
gloo-storage = "0.4"
wasm-bindgen-futures = "0.4"
