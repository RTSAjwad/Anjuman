<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anjuman</title>
    <link rel="stylesheet" href="https://unpkg.com/sanitize.css" />
    <!-- Tailwind + daisyUI (regenerated by the Trunk pre-build hook). Loaded
         additively alongside thaw's stylesheet (the `style` block below); thaw's
         CSS is removed once the component migration completes. -->
    <link data-trunk rel="css" href="./tailwind.css" />
    <!-- Shell-local styling for the deck list. The header row and each deck row
         share the same grid template, so the due-count badges line up in columns
         under New / Learning / Review regardless of nesting depth (only the title
         is indented, via an inline style). -->
    <style>
      .thaw-deck-header,
      .thaw-deck-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 4.5rem 4.5rem 4.5rem 2rem;
        gap: 0.5rem;
        align-items: center;
        width: 100%;
      }
      .thaw-deck-header {
        padding: 0.25rem 0.5rem 0.5rem;
        font-weight: 600;
        color: var(--colorNeutralForeground3);
      }
      .thaw-deck-col {
        justify-self: center;
      }
      .thaw-deck-col:first-child {
        justify-self: start;
      }
      .thaw-deck-tree {
        display: flex;
        flex-direction: column;
      }
      .thaw-deck-row {
        padding: 0.25rem 0.5rem;
        cursor: default;
      }
      /* No selection behaviour yet, so rows shouldn't look clickable or
         highlight on hover. Only the expander button is interactive. */
      .thaw-deck-row__title {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        min-width: 0;
      }
      .thaw-deck-row__expander {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.25rem;
        height: 1.25rem;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--colorNeutralForeground3);
        border-radius: var(--borderRadiusSmall, 2px);
      }
      .thaw-deck-row__expander:hover {
        color: var(--colorNeutralForeground3Hover);
        background-color: var(--colorNeutralBackground1Hover);
      }
      .thaw-deck-row__chevron {
        transition: transform var(--durationNormal, 200ms) var(--curveEasyEaseMax, ease);
      }
      .thaw-deck-row__label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Studyable deck title is a link-style button (opens the deck). */
      .thaw-deck-row__label--study {
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thaw-deck-row__label--study:hover {
        color: var(--colorBrandForeground1);
        text-decoration: underline;
      }
      /* Context-only ancestor: greyed, non-interactive, with a hint. */
      .thaw-deck-row__label--disabled {
        color: var(--colorNeutralForegroundDisabled);
        cursor: not-allowed;
      }
      .thaw-deck-row--disabled {
        opacity: 0.6;
      }
      .thaw-deck-row .badge {
        justify-self: center;
      }
      /* Deck options gear: a quiet icon button at the end of each studyable row. */
      .thaw-deck-row__actions {
        display: flex;
        justify-content: flex-end;
      }
      .thaw-deck-row__gear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem;
        height: 1.75rem;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--colorNeutralForeground3);
        border-radius: var(--borderRadiusSmall, 2px);
      }
      .thaw-deck-row__gear:hover {
        color: var(--colorNeutralForeground3Hover);
        background-color: var(--colorNeutralBackground1Hover);
      }
      /* Study screen: card surface + answer row. */
      .thaw-study-counts {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .thaw-study-answers {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .thaw-study-answer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.125rem;
      }
      .thaw-study-answer__interval {
        font-size: var(--fontSizeBase100);
        color: var(--colorNeutralForeground3);
      }
      /* Sidebar brand + user labels (the sidebar is a daisyUI `menu` inside the
       * drawer's `drawer-side`). */
      .app-sidebar__brand {
        font-weight: var(--fontWeightSemibold);
        font-size: var(--fontSizeBase500);
        padding: 0.75rem;
      }
      .app-sidebar__user {
        margin: 0;
        color: var(--colorNeutralForeground3);
      }
      /* Smooth the icon-only <-> expanded width change driven by DaisyUI's
       * `is-drawer-close`/`is-drawer-open` variants (the utility swap is
       * otherwise instant). */
      .app-sidebar {
        transition: width 0.2s ease-out;
      }
      /* Study-card action buttons in the header bar (Bury/Suspend/Reschedule/Flag). */
      .study-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .study-actions__group {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .study-actions__group .input {
        width: 5rem;
      }
      /* DaisyUI 5 puts both `dropdown` and `menu` on the same popover `<ul>` (its
       * canonical dropdown markup). The `.dropdown` class sets `display:
       * inline-block` in the same `@layer daisyui.l1.l2.l3` but later in source
       * order than `.menu`'s `display: flex`, so it wins and silently disables
       * the menu's flex-column layout (items touch the horizontal edges and gain
       * stray vertical spacing). This unlayered rule re-asserts the flex layout
       * so the `menu` item styling applies as intended. */
      .dropdown.menu {
        display: flex;
      }
      /* The flag picker dropdown is fully self-contained: it does NOT use
       * DaisyUI's `dropdown`/`menu` classes, so its layout can't be clobbered by
       * global resets (sanitize.css / Tailwind preflight) or DaisyUI's
       * zero-specificity `:where()` item selectors. Explicit, unlayered rules
       * here make it render identically regardless of the ancestor container
       * (navbar flex row vs. card-inspector `<dd>`). The `<ul>` is only rendered
       * while open (Leptos conditional), so no show/hide classes are needed. */
      .flag-dropdown {
        position: relative;
        display: inline-block;
      }
      .flag-dropdown__menu {
        display: flex;
        flex-direction: column;
        width: 13rem;
        padding: 0.5rem;
        margin: 0;
        list-style: none;
        position: absolute;
        top: 100%;
        right: 0;
        margin-top: 0.25rem;
        z-index: 999;
      }
      .flag-dropdown__menu li {
        margin: 0;
        padding: 0;
      }
      .flag-dropdown__menu li > button {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(auto, max-content) auto max-content;
        align-content: flex-start;
        align-items: center;
        gap: 0.5rem;
        width: 100%;
        text-align: start;
        padding-inline: 0.75rem;
        padding-block: 0.375rem;
        border-radius: var(--radius-field);
        border: none;
        background: transparent;
        cursor: pointer;
      }
      .flag-dropdown__menu li > button:hover,
      .flag-dropdown__menu li > button.menu-active {
        background-color: var(--color-base-200);
        color: var(--color-base-content);
      }
      /* Card browser (US-4.12): filter sidebar + full-fill table + pinned
         pagination. The browser fills the content area with no outer padding. */
      .card-browser {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      /* Row containing the filter sidebar + the main content area. */
      .card-browser__body {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: row;
      }
      .card-browser__sidebar {
        flex: 0 0 16rem;
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        border-right: 1px solid var(--colorNeutralStroke2);
        overflow-y: auto;
      }
      .card-browser__sidebar-search {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 0.5rem;
        border-bottom: 1px solid var(--colorNeutralStroke2);
      }
      .card-browser__sidebar-search .input {
        flex: 1 1 auto;
        min-width: 0;
      }
      /* The filter sidebar is a daisyUI `menu` with `<details>`/`<summary>`
         collapsible submenus. The sidebar is flush, so drop the menu's default
         outer padding and let it fill the width. */
      .card-browser__menu {
        width: 100%;
        padding: 0;
      }
      /* Restore DaisyUI's default submenu indentation for nested filter groups.
       * The `margin-inline-start` (1rem) + `padding-inline-start` (0.5rem) that
       * daisyUI applies via `li ul` is rendered inside a CSS `@layer`; when the
       * sidebar tree nests `<details>` directly under `<li>`, mark the child
       * `<ul>` explicitly so the indent survives any cascade-layer ordering with
       * the sidebar's own unlayered rules. */
      .card-browser__menu li > details > ul,
      .card-browser__menu li > ul {
        margin-inline-start: calc(0.25rem * 4);
        padding-inline-start: calc(0.25rem * 2);
        white-space: nowrap;
      }
      /* Tailwind's preflight sets `summary { display: list-item }`, which beats
         daisyUI's `display: grid` (layer ordering) and shows the native
         disclosure marker on the *left* instead of daisyUI's chevron on the
         *right*. Re-assert the grid layout so the chevron (`summary::after`,
         `justify-self: flex-end`) lands where daisyUI intends. */
      .card-browser__menu li > details > summary {
        display: grid;
        list-style: none;
      }
      /* A subtle "this deck only" qualifier on a parent deck's selectable entry
         (the parent deck appears as the first item inside its own submenu). */
      .card-browser__menu .card-browser__deck-self {
        font-size: var(--fontSizeBase100);
        color: var(--colorNeutralForeground3);
        font-weight: var(--fontWeightRegular);
      }
      /* The filter tree's active (selected) item uses daisyUI's default `base-200`
       * selection colour, matching the table's selected row. Drop daisyUI's
       * default strong `.menu-active` neutral fill (and its drop shadow). */
      .card-browser__menu li > .menu-active {
        background-color: var(--color-base-200);
        color: var(--color-base-content);
        --tw-outline-style: none;
        outline-style: none;
        box-shadow: none;
      }
      .card-browser__main {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: row;
      }
      .card-browser__content {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .card-browser__table {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      /* Left-align the header and cells consistently (the native <table> has a
         <th>/<td> per column now). */
      .card-browser__table th,
      .card-browser__table td {
        text-align: left;
      }
      .card-browser__table tbody tr {
        cursor: pointer;
      }
      .card-browser__table tbody tr.card-browser__row--selected {
        background-color: var(--color-base-200);
      }
      .card-browser__front {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-browser__inspector {
        flex: 0 0 20rem;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1rem;
        border-left: 1px solid var(--colorNeutralStroke2);
        overflow-y: auto;
        background-color: var(--colorNeutralBackground1);
      }
      .card-browser__inspector-title {
        margin: 0;
        font-size: var(--fontSizeBase400);
        font-weight: var(--fontWeightSemibold);
      }
      .card-browser__inspector-fields {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .card-browser__inspector-row {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .card-browser__inspector-row dt {
        flex: 0 0 auto;
        min-width: 5.5rem;
        color: var(--colorNeutralForeground3);
        font-weight: var(--fontWeightSemibold);
      }
      .card-browser__inspector-row dd {
        margin: 0;
        overflow-wrap: break-word;
      }
      .card-browser__inspector-row--stacked {
        flex-direction: column;
        gap: 0.125rem;
      }
      .card-browser__inspector-row--stacked dt {
        min-width: 0;
      }
      .card-browser__inspector-text {
        white-space: pre-wrap;
        color: var(--colorNeutralForeground1);
      }
      .card-browser__inspector-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding-top: 0.5rem;
        border-top: 1px solid var(--colorNeutralStroke2);
      }
      .card-browser__inspector-actions .input {
        width: 5rem;
      }
      .card-browser__switch {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
      }
      .card-browser__switch input {
        cursor: pointer;
      }
      .card-browser__switch-label {
        user-select: none;
      }
      /* Flag colour swatch (dot + label). */
      .card-browser__flag-sw {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .card-browser__flag-swatch {
        display: inline-block;
        width: 0.7rem;
        height: 0.7rem;
        border-radius: 50%;
        flex: 0 0 auto;
        background-color: transparent;
      }
      .card-browser__inspector-reschedule {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .card-browser__inspector-flag .select {
        min-height: 32px;
      }
      .card-browser__pagination {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--colorNeutralForeground2);
        padding: 0.5rem 0.75rem;
        border-top: 1px solid var(--colorNeutralStroke2);
      }
      /* Study screen fills the content area; card centred, controls pinned
         to the bottom. */
      .study-screen {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .study-screen__body {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }
      .study-card-view {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .study-card-view__iframe {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        border: none;
        background: #fff;
      }
      .study-card-view__controls {
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        padding: 1rem 1.5rem;
        gap: 0.5rem;
      }
      .app-login {
        max-width: 24rem;
        margin: 4rem auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      /* Deck-options panel (US-4.9 read-only + US-4.10 edit/save). */
      .deck-options {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 0 1.5rem;
      }
      .deck-options__header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
      }
      .deck-options__title {
        margin: 0;
        font-size: var(--fontSizeBase400);
        font-weight: var(--fontWeightSemibold);
      }
      .deck-options__preset {
        color: var(--colorNeutralForeground3);
      }
      .deck-options__readonly-notice {
        color: var(--colorNeutralForeground3);
        border-left: 3px solid var(--colorNeutralStroke2);
        padding-left: 0.75rem;
      }
      .deck-options-assign {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .deck-options-assign__label {
        font-weight: var(--fontWeightSemibold);
        color: var(--colorNeutralForeground2);
      }
      /* The global default preset is read-only: disable all controls and remove
         the save affordance (the Save button is omitted by the component). */
      .deck-options--readonly .deck-options-group {
        pointer-events: none;
        opacity: 0.7;
      }
      .deck-options__error {
        color: var(--colorPaletteRedForeground1, #c00);
      }
      .deck-options__empty {
        color: var(--colorNeutralForeground3);
      }
      .deck-options-group {
        border: 1px solid var(--colorNeutralStroke2);
        border-radius: var(--borderRadiusMedium, 4px);
        padding: 0.75rem 1rem;
        background-color: var(--colorNeutralBackground1);
      }
      .deck-options-group__title {
        margin: 0 0 0.5rem;
        font-size: var(--fontSizeBase300);
        font-weight: var(--fontWeightSemibold);
        color: var(--colorNeutralForeground2);
      }
      .deck-options-group__rows {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .deck-options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .deck-options-row__label {
        color: var(--colorNeutralForeground3);
      }
      .deck-options-row__control {
        display: flex;
        justify-content: flex-end;
        min-width: 0;
      }
      .deck-options-row__control .input,
      .deck-options-row__control .select {
        width: 16rem;
      }
      .deck-options__readonly {
        color: var(--colorNeutralForeground1);
        overflow-wrap: anywhere;
        text-align: right;
      }
      .deck-options__footer {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5rem;
      }
      .deck-options-easy-days {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .deck-options-easy-day {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      .deck-options-easy-day__label {
        color: var(--colorNeutralForeground3);
        min-width: 2.5rem;
        text-align: right;
      }
    </style>
    <!-- The lib and bin targets are both named `leptos_shell`; point trunk at
         the binary entrypoint explicitly. -->
    <link data-trunk rel="rust" data-bin="leptos_shell" />
  </head>
  <body>
    <!-- The Leptos app is mounted here by main.rs. -->
  </body>
</html>
