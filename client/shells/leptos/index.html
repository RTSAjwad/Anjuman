<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anjuman</title>
    <link rel="stylesheet" href="https://unpkg.com/sanitize.css" />
    <!-- Shell-local styling for the deck list. The header row and each deck row
         share the same grid template, so the due-count badges line up in columns
         under New / Learning / Review regardless of nesting depth (only the title
         is indented, via an inline style). -->
    <style>
      .thaw-deck-header,
      .thaw-deck-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 3rem 3.5rem 3.5rem 2rem;
        gap: 0.5rem;
        align-items: center;
        width: 100%;
      }
      .thaw-deck-header {
        padding: 0.25rem 0.5rem 0.5rem;
        font-weight: 600;
        color: var(--colorNeutralForeground3);
      }
      .thaw-deck-col {
        justify-self: end;
      }
      .thaw-deck-col:first-child {
        justify-self: start;
      }
      .thaw-deck-tree {
        display: flex;
        flex-direction: column;
      }
      .thaw-deck-row {
        padding: 0.25rem 0.5rem;
        cursor: default;
      }
      /* No selection behaviour yet, so rows shouldn't look clickable or
         highlight on hover. Only the expander button is interactive. */
      .thaw-deck-row__title {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        min-width: 0;
      }
      .thaw-deck-row__expander {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.25rem;
        height: 1.25rem;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--colorNeutralForeground3);
        border-radius: var(--borderRadiusSmall, 2px);
      }
      .thaw-deck-row__expander:hover {
        color: var(--colorNeutralForeground3Hover);
        background-color: var(--colorNeutralBackground1Hover);
      }
      .thaw-deck-row__chevron {
        transition: transform var(--durationNormal, 200ms) var(--curveEasyEaseMax, ease);
      }
      .thaw-deck-row__label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Studyable deck title is a link-style button (opens the deck). */
      .thaw-deck-row__label--study {
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        color: inherit;
        font: inherit;
        text-align: left;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .thaw-deck-row__label--study:hover {
        color: var(--colorBrandForeground1);
        text-decoration: underline;
      }
      /* Context-only ancestor: greyed, non-interactive, with a hint. */
      .thaw-deck-row__label--disabled {
        color: var(--colorNeutralForegroundDisabled);
        cursor: not-allowed;
      }
      .thaw-deck-row--disabled {
        opacity: 0.6;
      }
      .thaw-deck-row .thaw-badge {
        justify-self: end;
      }
      /* Deck options gear: a quiet icon button at the end of each studyable row. */
      .thaw-deck-row__actions {
        display: flex;
        justify-content: flex-end;
      }
      .thaw-deck-row__gear {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem;
        height: 1.75rem;
        padding: 0;
        border: none;
        background: none;
        cursor: pointer;
        color: var(--colorNeutralForeground3);
        border-radius: var(--borderRadiusSmall, 2px);
      }
      .thaw-deck-row__gear:hover {
        color: var(--colorNeutralForeground3Hover);
        background-color: var(--colorNeutralBackground1Hover);
      }
      /* Study screen: card surface + answer row. */
      .thaw-study-counts {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .thaw-study-card {
        border: 1px solid var(--colorNeutralStroke2);
        border-radius: var(--borderRadiusMedium, 4px);
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background-color: var(--colorNeutralBackground1);
      }
      .thaw-study-card__state {
        align-self: flex-start;
        font-size: var(--fontSizeBase200);
        color: var(--colorNeutralForeground3);
        text-transform: capitalize;
      }
      .thaw-study-card__front,
      .thaw-study-card__back {
        margin: 0;
      }
      .thaw-study-card--answer {
        border-color: var(--colorBrandStroke2);
      }
      .thaw-study-answers {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .thaw-study-answer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.125rem;
      }
      .thaw-study-answer__interval {
        font-size: var(--fontSizeBase100);
        color: var(--colorNeutralForeground3);
      }
      /* Again = red; Hard/Good/Easy stay the default primary (blue). */
      .thaw-study-answers__again {
        background-color: var(--colorPaletteRedBackground3) !important;
        color: var(--colorNeutralForegroundOnBrand, #fff) !important;
        border-color: var(--colorPaletteRedBorder2) !important;
      }
      /* App shell: sidebar + content, with breadcrumbs above each screen. */
      .app-shell {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      /* The NavDrawer IS the sidebar (header/footer slotted). thaw's NavDrawer
       * keeps its own fixed 260px width and 100% height; we only pin it to the
       * left (no shrink) and give it the shell's divider. */
      .app-sidebar-nav {
        flex: 0 0 auto;
        border-right: 1px solid var(--colorNeutralStroke2);
      }
      .app-sidebar__brand {
        font-weight: var(--fontWeightSemibold);
        font-size: var(--fontSizeBase500);
      }
      .app-sidebar__footer {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .app-sidebar__user {
        margin: 0;
        color: var(--colorNeutralForeground3);
      }
      .app-content {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        height: 100vh;
        /* The content scrolls independently of the fixed sidebar. */
        overflow-y: auto;
      }
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.5rem 0;
      }
      .app-header__right {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      /* Study-card action buttons in the top bar (Bury/Suspend/Reschedule/Flag). */
      .study-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .study-actions__group {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .study-actions__group .thaw-input {
        width: 5rem;
      }
      .app-content__pad {
        padding: 0 1.5rem 1rem;
      }
      /* Card browser (US-4.12): thaw Tree filter sidebar + full-fill table + pinned
         pagination. The browser fills the content area with no outer padding. */
      .card-browser {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      .card-browser__sidebar {
        flex: 0 0 16rem;
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        border-right: 1px solid var(--colorNeutralStroke2);
        overflow-y: auto;
      }
      .card-browser__sidebar-search {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 0.5rem;
        border-bottom: 1px solid var(--colorNeutralStroke2);
      }
      .card-browser__sidebar-search .thaw-input {
        flex: 1 1 auto;
        min-width: 0;
      }
      /* The filter tree replicates thaw's `Tree`/`TreeItem` CSS (the component
         logic is hand-rolled — see `filter_branch` — but the visuals match).
         Rows are full-width, non-truncating, with the expand chevron and easy
         hover/active states. */
      .card-browser .thaw-tree {
        display: flex;
        flex-direction: column;
        row-gap: var(--spacingVerticalXXS);
      }
      .card-browser .thaw-tree-item {
        position: relative;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
        cursor: pointer;
      }
      .card-browser .thaw-tree-item-layout {
        display: flex;
        align-items: center;
        min-height: 32px;
        box-sizing: border-box;
        padding: var(--spacingVerticalXS) var(--spacingHorizontalNone);
        color: var(--colorNeutralForeground2);
        font-family: var(--fontFamilyBase);
        font-weight: var(--fontWeightRegular);
        font-size: var(--fontSizeBase300);
        line-height: var(--lineHeightBase300);
      }
      .card-browser .thaw-tree-item-layout:hover {
        color: var(--colorNeutralForeground2Hover);
        background-color: var(--colorSubtleBackgroundHover);
      }
      .card-browser .thaw-tree-item-layout:active {
        color: var(--colorNeutralForeground2Pressed);
        background-color: var(--colorSubtleBackgroundPressed);
      }
      .card-browser .thaw-tree-item-layout__expand-icon {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 24px;
        box-sizing: border-box;
        color: var(--colorNeutralForeground3);
      }
      .card-browser .thaw-tree-item-layout:hover .thaw-tree-item-layout__expand-icon {
        color: var(--colorNeutralForeground3Hover);
      }
      .card-browser .thaw-tree-item-layout__main {
        flex: 1 1 auto;
        min-width: 0;
        padding: 0 var(--spacingHorizontalXXS);
        overflow-wrap: break-word;
      }
      .card-browser .thaw-tree-item-layout__expand-icon svg {
        transition: transform var(--durationNormal, 200ms) var(--curveEasyEaseMax, ease);
      }
      /* Indent only the row content (the layout) of leaves, matching thaw's
         `--thaw-tree-item--level` approach: the `.thaw-tree-item` stays full
         width (so hover/active backgrounds span the sidebar) while the layout
         and its text shift right. */
      .card-browser__leaves {
        display: flex;
        flex-direction: column;
      }
      .card-browser__leaves .thaw-tree-item-layout {
        padding-left: calc(var(--spacingHorizontalXXL, 24px) * 2);
      }
      .card-browser__leaves[hidden] {
        display: none;
      }
      /* Active filter leaf (brand colour + subtle emphasis). */
      .card-browser .thaw-tree-item-layout.card-browser__leaf--active {
        color: var(--colorBrandForeground1);
        background-color: var(--colorBrandBackground2, var(--colorSubtleBackground));
        font-weight: var(--fontWeightSemibold);
      }
      .card-browser__main {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: row;
      }
      .card-browser__content {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .card-browser__table {
        flex: 1 1 auto;
        min-width: 0;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }
      /* Left-align the header and cells consistently (thaw's header button
         inherits alignment, so pin both to the left). */
      .card-browser__table .thaw-table-header-cell,
      .card-browser__table .thaw-table-header-cell__button,
      .card-browser__table .thaw-table-cell {
        text-align: left;
      }
      .card-browser__table .thaw-table-row {
        cursor: pointer;
      }
      .card-browser__table .thaw-table-row.card-browser__row--selected {
        background-color: var(--colorBrandBackground2, var(--colorSubtleBackground));
      }
      .card-browser__front {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* The notes browser (US-4.13) still uses the hand-rolled grid rows; keep
         those classes intact (the card browser's own table now uses thaw's
         `.thaw-table-*` classes instead). */
      .card-browser__row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 8rem 6rem 5rem;
        gap: 0.5rem;
        align-items: center;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
      }
      .card-browser__row:hover {
        background-color: var(--colorNeutralBackground1Hover);
      }
      .card-browser__row--selected {
        background-color: var(--colorBrandBackground2, var(--colorNeutralBackground2));
      }
      .card-browser__cell {
        color: var(--colorNeutralForeground2);
      }
      .card-browser__flag {
        color: var(--colorNeutralForeground3);
      }
      .card-browser__inspector {
        flex: 0 0 20rem;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1rem;
        border-left: 1px solid var(--colorNeutralStroke2);
        overflow-y: auto;
        background-color: var(--colorNeutralBackground1);
      }
      .card-browser__inspector-title {
        margin: 0;
        font-size: var(--fontSizeBase400);
        font-weight: var(--fontWeightSemibold);
      }
      .card-browser__inspector-fields {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .card-browser__inspector-row {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
      }
      .card-browser__inspector-row dt {
        flex: 0 0 auto;
        min-width: 5.5rem;
        color: var(--colorNeutralForeground3);
        font-weight: var(--fontWeightSemibold);
      }
      .card-browser__inspector-row dd {
        margin: 0;
        overflow-wrap: break-word;
      }
      .card-browser__inspector-row--stacked {
        flex-direction: column;
        gap: 0.125rem;
      }
      .card-browser__inspector-row--stacked dt {
        min-width: 0;
      }
      .card-browser__inspector-text {
        white-space: pre-wrap;
        color: var(--colorNeutralForeground1);
      }
      .card-browser__inspector-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        padding-top: 0.5rem;
        border-top: 1px solid var(--colorNeutralStroke2);
      }
      .card-browser__inspector-actions .thaw-input {
        width: 5rem;
      }
      .card-browser__inspector-switch {
        display: inline-flex;
      }
      .card-browser__inspector-reschedule {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .card-browser__inspector-flag .thaw-select__select {
        min-height: 32px;
        padding: 0 var(--spacingHorizontalS);
        border: 1px solid var(--colorNeutralStroke1);
        border-radius: var(--borderRadiusMedium, 4px);
        background-color: var(--colorNeutralBackground1);
        color: var(--colorNeutralForeground1);
        font: inherit;
      }
      .card-browser__pagination {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--colorNeutralForeground2);
        padding: 0.5rem 0.75rem;
        border-top: 1px solid var(--colorNeutralStroke2);
      }
      /* Notes browser (US-4.13): table, per-note editor, create form. */
      .notes-browser {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .notes-browser__table .thaw-deck-header {
        grid-template-columns: minmax(0, 1fr) 10rem 12rem;
      }
      .notes-browser__table .card-browser__row {
        grid-template-columns: minmax(0, 1fr) 10rem 12rem;
      }
      .notes-browser__editor,
      .notes-browser__create {
        border: 1px solid var(--colorNeutralStroke2);
        border-radius: var(--borderRadiusMedium, 4px);
        padding: 0.75rem 1rem;
        background-color: var(--colorNeutralBackground1);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .notes-browser__fieldlist {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .notes-browser__field {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: var(--fontWeightSemibold);
        color: var(--colorNeutralForeground2);
      }
      .notes-browser__field span {
        min-width: 10rem;
      }
      .notes-browser__field .thaw-input {
        flex: 1 1 auto;
      }
      .notes-browser__row-actions,
      .notes-browser__create-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      /* Study screen fills the content area; card centred, controls pinned
         to the bottom. */
      .study-screen {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .study-screen__body {
        flex: 1 1 auto;
        display: flex;
        min-height: 0;
      }
      .study-card-view {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .study-card-view__iframe {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        border: none;
        background: #fff;
      }
      .study-card-view__controls {
        flex: 0 0 auto;
        display: flex;
        justify-content: center;
        padding: 1rem 1.5rem;
        gap: 0.5rem;
      }
      .app-login {
        max-width: 24rem;
        margin: 4rem auto;
        padding: 0 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      /* Breadcrumb back-link (plain button, since thaw's BreadcrumbButton has no
         click hook). Reuses thaw's breadcrumb-button class for consistent look. */
      .thaw-breadcrumb-button {
        border: none;
        background: none;
        padding: 0;
        cursor: pointer;
        font: inherit;
        color: var(--colorBrandForeground1);
      }
      .thaw-breadcrumb-button:hover {
        text-decoration: underline;
      }
      .thaw-breadcrumb-button--current {
        color: var(--colorNeutralForeground1);
        cursor: default;
      }
      .thaw-breadcrumb-button--current:hover {
        text-decoration: none;
      }
      /* Deck-options panel (US-4.9 read-only + US-4.10 edit/save). */
      .deck-options {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 0 1.5rem;
      }
      .deck-options__header {
        display: flex;
        align-items: baseline;
        gap: 0.75rem;
      }
      .deck-options__title {
        margin: 0;
        font-size: var(--fontSizeBase400);
        font-weight: var(--fontWeightSemibold);
      }
      .deck-options__preset {
        color: var(--colorNeutralForeground3);
      }
      .deck-options__readonly-notice {
        color: var(--colorNeutralForeground3);
        border-left: 3px solid var(--colorNeutralStroke2);
        padding-left: 0.75rem;
      }
      .deck-options-assign {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .deck-options-assign__label {
        font-weight: var(--fontWeightSemibold);
        color: var(--colorNeutralForeground2);
      }
      /* The global default preset is read-only: disable all controls and remove
         the save affordance (the Save button is omitted by the component). */
      .deck-options--readonly .deck-options-group {
        pointer-events: none;
        opacity: 0.7;
      }
      .deck-options__error {
        color: var(--colorPaletteRedForeground1, #c00);
      }
      .deck-options__empty {
        color: var(--colorNeutralForeground3);
      }
      .deck-options-group {
        border: 1px solid var(--colorNeutralStroke2);
        border-radius: var(--borderRadiusMedium, 4px);
        padding: 0.75rem 1rem;
        background-color: var(--colorNeutralBackground1);
      }
      .deck-options-group__title {
        margin: 0 0 0.5rem;
        font-size: var(--fontSizeBase300);
        font-weight: var(--fontWeightSemibold);
        color: var(--colorNeutralForeground2);
      }
      .deck-options-group__rows {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .deck-options-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      .deck-options-row__label {
        color: var(--colorNeutralForeground3);
      }
      .deck-options-row__control {
        display: flex;
        justify-content: flex-end;
        min-width: 0;
      }
      .deck-options-row__control .thaw-input,
      .deck-options-row__control .thaw-select {
        width: 16rem;
      }
      .deck-options__readonly {
        color: var(--colorNeutralForeground1);
        overflow-wrap: anywhere;
        text-align: right;
      }
      .deck-options__footer {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.5rem;
      }
      .deck-options-easy-days {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .deck-options-easy-day {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 0.5rem;
      }
      .deck-options-easy-day__label {
        color: var(--colorNeutralForeground3);
        min-width: 2.5rem;
        text-align: right;
      }
    </style>
    <!-- The lib and bin targets are both named `leptos_shell`; point trunk at
         the binary entrypoint explicitly. -->
    <link data-trunk rel="rust" data-bin="leptos_shell" />
  </head>
  <body>
    <!-- The Leptos app is mounted here by main.rs. -->
  </body>
</html>
